<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Дашборди Mafia&Casta</title>
<style>
  :root{
    --bg:#131722; --card:#1b2233; --line:rgba(255,255,255,.08);
    --text:#e8ecf5; --muted:#8b93a7; --accent:#4d7cfe;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);padding:24px 16px;
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{width:100%;max-width:520px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  a.board{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:10px;color:inherit;text-decoration:none}
  a.board:hover{border-color:var(--accent)}
  a.board .nm{font-weight:600}
  a.board .ds{color:var(--muted);font-size:13px;margin-top:2px}
  a.board .go{color:var(--accent);font-size:13px;white-space:nowrap}
  .note{color:var(--muted);font-size:12.5px;margin-top:18px;display:flex;gap:8px;align-items:baseline}
  .dot{width:7px;height:7px;border-radius:50%;background:#3ddc84;flex:0 0 auto;
    position:relative;top:-1px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Дашборди Mafia&amp;Casta</h1>
    <p class="sub">Управлінська аналітика мережі. Доступ за паролем.</p>

    <a class="board" href="retention/">
      <span>
        <span class="nm">Retention</span>
        <span class="ds">LTV, CAC, частота, повторні покупки, відтік — за каналами</span>
      </span>
      <span class="go">Відкрити →</span>
    </a>

    <p class="note"><span class="dot"></span>
      <span>Сторінки зашифровані AES-256-GCM. Дані оновлюються щодня о 12:00 з Syrve.</span></p>
  </div>
</body>
</html>
